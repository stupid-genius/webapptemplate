<!DOCTYPE HTML>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Web Application Advanced Template</title>
		<link rel="stylesheet" href="styles/login.css">
	</head>
	<body>
		<section id="header">
			<div class="navbar-logo">
				<h1>Web Application Template</h1>
			</div>
			<div class="navbar-right">Advanced Template</div>
		</section>

		<section id="main">
			<div class="login-box">
				<div class="login-title">Log In</div>
				<form method="POST" action="/login">
					<label class="login-label" for="username">Username:</label>
					<input class="login-input" type="text" id="username" name="username" autocomplete="username" />
					<label class="login-label" for="password">Password:</label>
					<input class="login-input" type="password" id="password" name="password" autocomplete="current-password" />
					<button class="login-btn" type="submit">LOG IN</button>
				</form>
			</div>
		</section>

		<section id="footer">
			<div>
				<div>Created by Stupid Genius Software</div>
			</div>
		</section>
	</body>
</html>
