version: "3"
services:
  app:
    build: .
    restart: always
    environment:
      APPHOST: ${APPHOST}
      APPPORT: ${APPPORT}
      APPURL: ${APPURL}
      AUTH_STRATEGY: ${AUTH_STRATEGY}
      DBHOST: ${DBHOST}
      DBPORT: ${DBPORT}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DOCS_ROOT_PASSWORD: ${DOCS_ROOT_PASSWORD}
      LOGFILE: ${LOGFILE}
      LOGLEVEL: ${LOGLEVEL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_PROVIDER_URL: ${OIDC_PROVIDER_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
  mongo:
    build: docs
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${DOCS_ROOT_PASSWORD}
    volumes:
      - ./docs/data:/data/db
      # - mongo-data:/data/db
  mysql:
    build: db
    command: --default-authentication-plugin=mysql_native_password
    # command: --mysql-native-password=ON
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./db/data:/var/lib/mysql
    healthcheck:
      test: 'mysql -p${DB_ROOT_PASSWORD} -h localhost -e "SELECT 1+1 as result" &> /dev/null'
      timeout: 5s
      retries: 10
  nginx:
    build: nginx
    restart: always
    ports:
      - "${NGINX_PORT:-443}:443"
    depends_on:
      - app
      - mongo
      - valkey
  valkey:
    build: keyval
    restart: always
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: always
    depends_on:
      - prometheus
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command: -nginx.scrape-uri=http://nginx/nginx_status
    depends_on:
      - nginx
